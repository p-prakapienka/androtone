name: Build release artifacts

on:
  push:
    branches:
      - master
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S Builds/desktop -B build/windows -A x64

      - name: Build
        run: cmake --build build/windows --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build/windows -C Release --output-on-failure --no-tests=ignore

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "dist/androtone-windows-x86_64"
          New-Item -ItemType Directory -Force "$package/VST3" | Out-Null
          Copy-Item "build/windows/Androtone_artefacts/Release/Standalone/Androtone.exe" $package
          Copy-Item "build/windows/Androtone_artefacts/Release/VST3/Androtone.vst3" "$package/VST3" -Recurse
          Compress-Archive -Path "$package/*" -DestinationPath "dist/androtone-windows-x86_64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: androtone-windows-x86_64
          path: dist/androtone-windows-x86_64.zip
          if-no-files-found: error

  android:
    name: Android universal APK
    runs-on: ubuntu-latest
    env:
      JUCE_VERSION: 8.0.12
      JUCE_LINUX_SHA256: 3e21cb580678d1ab5d3efd387fa1924de11569c99e8888bd6b6d49e0b5e1c924

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android native toolchain
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;28.1.13356709"

      - name: Prepare JUCE Android export
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output juce-linux.zip \
            "https://github.com/juce-framework/JUCE/releases/download/${JUCE_VERSION}/juce-${JUCE_VERSION}-linux.zip"
          echo "${JUCE_LINUX_SHA256}  juce-linux.zip" | sha256sum --check
          unzip -q juce-linux.zip
          mv JUCE juce
          ./juce/Projucer --resave androtone.jucer --lf
          rm -f Builds/android/local.properties

      - name: Create CI signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Androtone CI,O=Restricted Space,C=PL" \
            -keyalg RSA \
            -validity 10000

      - name: Build APK
        working-directory: Builds/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          apk="$(find Builds/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" dist/androtone-android-universal.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: androtone-android-universal
          path: dist/androtone-android-universal.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs:
      - windows
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --generate-notes \
              --verify-tag
          else
            if gh release view nightly >/dev/null 2>&1; then
              gh release delete nightly --cleanup-tag --yes
            fi

            gh release create nightly dist/* \
              --target "$GITHUB_SHA" \
              --title "Nightly build" \
              --notes "Development build from commit $GITHUB_SHA." \
              --prerelease
          fi
