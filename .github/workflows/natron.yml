name: natron

on:
  push:
    paths:
      - "natron/**"
      - ".github/workflows/natron.yml"
  pull_request:
    paths:
      - "natron/**"
      - ".github/workflows/natron.yml"

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # JUCE builds its juceaide helper at configure time, which needs the X11/font headers even
      # though the tests themselves use no GUI code.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl-dev

      - name: Configure
        run: cmake -S natron -B natron/build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build natron/build --target NatronTests

      - name: Run tests
        run: ctest --test-dir natron/build --output-on-failure
