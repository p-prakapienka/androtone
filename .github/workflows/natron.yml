name: natron

on:
  push:
    paths:
      - "natron/**"
      - ".github/workflows/natron.yml"
  pull_request:
    paths:
      - "natron/**"
      - ".github/workflows/natron.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # JUCE builds its juceaide helper at configure time, which needs the X11/font headers even
      # though the tests themselves use no GUI code.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl-dev

      - name: Configure
        run: cmake -S natron -B natron/build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build natron/build --target NatronTests

      - name: Run tests
        run: ctest --test-dir natron/build --output-on-failure

  # Release APK (optimised, signed with a debug key) for testing on a device: download it from the
  # run's Artifacts. The key is cached so later builds install over earlier ones without losing the
  # autosave; if the cache expires, uninstall the old build first.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            natron/Builds/Android/**/*.gradle
            natron/Builds/Android/gradle/wrapper/gradle-wrapper.properties

      # The Projucer export reads JUCE from natron/external/JUCE (the desktop CMake's CPM folder).
      - name: Fetch JUCE
        run: git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git natron/external/JUCE

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.1.13356709" "cmake;3.22.1" > /dev/null

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: natron-debug-keystore-v1

      - name: Create signing key
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storetype JKS \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        working-directory: natron/Builds/Android
        run: ./gradlew --no-daemon assembleRelease_Release

      - uses: actions/upload-artifact@v4
        with:
          name: natron-apk
          path: natron/Builds/Android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
