name: Build

on:
  push:
    branches: [note-clone]
  pull_request:
  workflow_dispatch:

env:
  JUCE_VERSION: 8.0.12

jobs:
  tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev \
            libcurl4-openssl-dev libgtk-3-dev

      - name: Fetch JUCE
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRB_JUCE_DIR=JUCE

      - name: Build
        run: cmake --build build --target RiffbookTests Riffbook

      - name: Run tests
        run: ./build/RiffbookTests_artefacts/Release/RiffbookTests

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (for Projucer)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev \
            libcurl4-openssl-dev libgtk-3-dev xvfb

      - name: Fetch JUCE
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git JUCE

      - name: Cache Projucer
        id: projucer-cache
        uses: actions/cache@v4
        with:
          path: JUCE/extras/Projucer/Builds/LinuxMakefile/build/Projucer
          key: projucer-${{ env.JUCE_VERSION }}-ubuntu-24.04

      - name: Build Projucer
        if: steps.projucer-cache.outputs.cache-hit != 'true'
        run: make -C JUCE/extras/Projucer/Builds/LinuxMakefile CONFIG=Release -j"$(nproc)"

      - name: Generate Android Studio project
        run: xvfb-run -a JUCE/extras/Projucer/Builds/LinuxMakefile/build/Projucer --resave Riffbook.jucer

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        run: |
          NDK=$(grep -oP 'ndkVersionString = "\K[^"]+' Builds/Android/app/build.gradle)
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" "cmake;3.22.1" > /dev/null

      - name: Debug keystore
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        working-directory: Builds/Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: riffbook-debug-apk
          path: Builds/Android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
