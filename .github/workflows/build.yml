name: Build

on:
  push:
    branches: [ccr-2f1e2138-49ckmf]
  pull_request:
  workflow_dispatch:

jobs:
  # Windows x64 Release: the standalone app, plus the headless tests. Download Cliptone.exe from
  # the run's Artifacts.
  windows:
    name: Windows (standalone)
    runs-on: windows-latest
    env:
      # CPM downloads JUCE at configure time; keep the download between runs.
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('Builds/desktop/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S Builds/desktop -B build -A x64 -DCLIPTONE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel --target Cliptone_Standalone CliptoneTests

      # Report the program's own exit code (PowerShell otherwise turns any failure, crashes
      # included, into a plain 1).
      - name: Run tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & ./build/CliptoneTests_artefacts/Release/CliptoneTests.exe
          $code = $LASTEXITCODE
          Write-Host ("CliptoneTests exit code: {0} (0x{0:X8})" -f $code)
          exit $code

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cliptone-test-log
          path: CliptoneTests.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: cliptone-windows-x64
          path: build/Cliptone_artefacts/Release/Standalone/Cliptone.exe
          if-no-files-found: error
