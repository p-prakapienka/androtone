name: Build

on:
  push:
    branches: [ccr-2f1e2138-49ckmf]
  pull_request:
  workflow_dispatch:

jobs:
  # Windows x64 Release: the standalone app and the VST3, plus the headless tests. Download the
  # zip from the run's Artifacts.
  windows:
    name: Windows (standalone + VST3)
    runs-on: windows-latest
    env:
      # CPM downloads JUCE at configure time; keep the download between runs.
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('Builds/desktop/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S Builds/desktop -B build -A x64 -DCLIPTONE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel --target Cliptone_Standalone Cliptone_VST3 CliptoneTests

      # Report the program's own exit code (PowerShell otherwise turns any failure, crashes
      # included, into a plain 1).
      - name: Run tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & ./build/CliptoneTests_artefacts/Release/CliptoneTests.exe
          $code = $LASTEXITCODE
          Write-Host ("CliptoneTests exit code: {0} (0x{0:X8})" -f $code)
          exit $code

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cliptone-test-log
          path: CliptoneTests.log
          if-no-files-found: warn

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "dist/cliptone-windows-x64"
          New-Item -ItemType Directory -Force "$package/VST3" | Out-Null
          Copy-Item "build/Cliptone_artefacts/Release/Standalone/Cliptone.exe" $package
          Copy-Item "build/Cliptone_artefacts/Release/VST3/Cliptone.vst3" "$package/VST3" -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: cliptone-windows-x64
          path: dist/cliptone-windows-x64
          if-no-files-found: error
